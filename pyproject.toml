[project]
name = "trade-bot"
version = "0.1.0"
description = "Crypto market analysis and alerting bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiodns==3.2.0",
    "aiohappyeyeballs==2.4.3",
    "aiohttp==3.10.10",
    "aiosignal==1.3.1",
    "alembic==1.17.2",
    "annotated-types==0.7.0",
    "anyio==4.6.0",
    "APScheduler==3.10.4",
    "arrow==1.3.0",
    "asyncio==3.4.3",
    "attrs==24.2.0",
    "ccxt==4.4.17",
    "certifi==2024.8.30",
    "cffi==1.17.1",
    "charset-normalizer==3.4.0",
    "circuitbreaker==2.0.0",
    "click==8.0.4",
    "colorama==0.4.6",
    "colorlog==6.10.1",
    "cryptography==42.0.8",
    "dnspython==2.6.1",
    "fastapi==0.115.0",
    "frozenlist==1.4.1",
    "greenlet==3.3.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.10",
    "jmespath==0.10.0",
    "joblib==1.5.1",
    "llvmlite==0.46.0",
    "Mako==1.3.10",
    "MarkupSafe==3.0.3",
    "motor==3.6.0",
    "multidict==6.1.0",
    "numba==0.63.1",
    "numpy==1.26.4",
    "oci==2.135.1",
    "oci-cli==3.48.2",
    "optuna==4.6.0",
    "packaging==25.0",
    "pandas==2.2.3",
    "patsy==1.0.1",
    "prompt-toolkit==3.0.43",
    "propcache==0.2.0",
    "pycares==4.4.0",
    "pycparser==2.22",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pydantic_core==2.23.4",
    "Pygments==2.19.2",
    "pymongo==4.9.1",
    "pyOpenSSL==24.2.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pytz==2024.2",
    "PyYAML==6.0.1",
    "requests==2.32.3",
    "scikit-learn==1.7.1",
    "scipy==1.16.0",
    "setuptools==75.1.0",
    "six==1.16.0",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.45",
    "starlette==0.38.6",
    "statsmodels==0.14.5",
    "terminaltables==3.1.10",
    "threadpoolctl==3.6.0",
    "tqdm==4.67.1",
    "types-python-dateutil==2.9.0.20241003",
    "typing_extensions==4.12.2",
    "tzdata==2024.2",
    "tzlocal==5.2",
    "urllib3==2.2.3",
    "uvicorn==0.30.6",
    "wcwidth==0.2.13",
    "xgboost==3.0.2",
    "yarl==1.15.0",
]

[dependency-groups]
dev = [
    "coverage==7.10.4",
    "iniconfig==2.1.0",
    "pluggy==1.6.0",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # Depends() in defaults is idiomatic FastAPI
    "UP046",  # Pydantic Generic[T] doesn't support PEP 695 yet
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
